<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>Águas Alerta</title>

  <link rel="stylesheet" href="css/styles.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .dropdown-item {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: rgba(255,255,255,0.08); }

    .river-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      flex-shrink: 0;
    }

    .river-loc {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-left: auto;
    }

    .alertas-section {
      width: 90%;
      max-width: 820px;
    }

    .alertas-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .alertas-header h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .alertas-badge {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .alertas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .alerta-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .alerta-card.critico {
      border-color: rgba(239,68,68,0.4);
      background: rgba(239,68,68,0.08);
    }

    .alerta-card.aviso {
      border-color: rgba(245,158,11,0.4);
      background: rgba(245,158,11,0.08);
    }

    .alerta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .alerta-rio {
      font-size: 13px;
      font-weight: 700;
    }

    .alerta-nivel {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .critico .alerta-nivel {
      background: rgba(239,68,68,0.2);
      color: #fca5a5;
    }

    .aviso .alerta-nivel {
      background: rgba(245,158,11,0.2);
      color: #fcd34d;
    }

    .alerta-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
    }

    .alerta-data {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }

    .sem-alertas {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      padding: 16px 0;
    }
  </style>
</head>

<body>

  <header>
    <img src="assets/images/logo.png" alt="Águas Alerta" class="logo">
    <a href="pages/login.html" class="admin-btn">↪ Admin/Tecnico</a>
  </header>

  <main class="hero">
    <section class="hero-text">
      <h1>Águas alertas</h1>
      <p>em todo o sítio perto de si</p>
    </section>

    <!-- Barra de pesquisa com dropdown -->
    <div class="search-wrapper" style="position:relative; width:560px; max-width:85%;">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Selecione uma estação..."
               readonly onclick="toggleDropdown()" style="cursor:pointer;">
        <button class="icon-btn" id="btnLocalizacao">
          <i data-lucide="map-pin"></i>
        </button>
        <button class="icon-btn" id="btnMapa" onclick="toggleMapa()" title="Ver no mapa">
          <i data-lucide="map"></i>
        </button>
      </div>

      <div id="dropdown" style="display:none; position:absolute; top:62px; left:0; right:0;
           background:rgba(10,30,100,0.97); border:1px solid rgba(255,255,255,0.12);
           border-radius:16px; overflow:hidden; z-index:100; backdrop-filter:blur(12px);">
        <div style="padding:12px 20px 8px; font-size:11px; font-weight:700;
                    color:rgba(255,255,255,0.4); letter-spacing:0.08em; text-transform:uppercase;">
          Estações de monitorização
        </div>
        <div class="dropdown-item" onclick="selecionarRio('Tejo — Santarém')">
          <div class="river-dot"></div><span>Tejo</span><span class="river-loc">Santarém</span>
        </div>
        <div class="dropdown-item" onclick="selecionarRio('Douro — Porto')">
          <div class="river-dot"></div><span>Douro</span><span class="river-loc">Porto</span>
        </div>
        <div class="dropdown-item" onclick="selecionarRio('Mondego — Coimbra')">
          <div class="river-dot"></div><span>Mondego</span><span class="river-loc">Coimbra</span>
        </div>
        <div class="dropdown-item" onclick="selecionarRio('Guadiana — Évora')">
          <div class="river-dot"></div><span>Guadiana</span><span class="river-loc">Évora</span>
        </div>
        <div class="dropdown-item" onclick="selecionarRio('Lima — Viana do Castelo')">
          <div class="river-dot"></div><span>Lima</span><span class="river-loc">Viana do Castelo</span>
        </div>
      </div>
    </div>

    <!-- Alertas ativos -->
    <section class="alertas-section">
      <div class="alertas-header">
        <h2>Alertas ativos</h2>
        <span class="alertas-badge" id="alertasBadge">a carregar...</span>
      </div>
      <div class="alertas-grid" id="alertasGrid">
        <p class="sem-alertas">A carregar alertas...</p>
      </div>
    </section>

    <!-- Mapa (escondido por defeito) -->
    <div id="map" style="display:none;"></div>

  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    lucide.createIcons();

    const API_BASE = 'http://localhost/Aguas-Alertas/backend';

    let mapaAberto = false;
    let mapaIniciado = false;
    let map;

    // Dropdown
    function toggleDropdown() {
      const dd = document.getElementById('dropdown');
      dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    }

   function selecionarRio(nome) {
  document.getElementById('searchInput').value = nome;
  document.getElementById('dropdown').style.display = 'none';
  window.location.href = `pages/dashboard.html?estacao=${encodeURIComponent(nome)}`;
}

    // Fechar dropdown ao clicar fora
    document.addEventListener('click', e => {
      const wrapper = document.querySelector('.search-wrapper');
      if (!wrapper.contains(e.target)) {
        document.getElementById('dropdown').style.display = 'none';
      }
    });

    // Mapa
    function toggleMapa() {
      const mapEl = document.getElementById('map');
      mapaAberto = !mapaAberto;
      mapEl.style.display = mapaAberto ? 'block' : 'none';

      if (mapaAberto && !mapaIniciado) {
        map = L.map('map').setView([39.5, -8.0], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(map);
        mapaIniciado = true;
      }
    }

    // Geolocalização
    document.getElementById('btnLocalizacao').addEventListener('click', () => {
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        if (!mapaIniciado) {
          document.getElementById('map').style.display = 'block';
          map = L.map('map').setView([lat, lng], 13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
          }).addTo(map);
          mapaIniciado = true;
          mapaAberto = true;
        } else {
          map.setView([lat, lng], 13);
        }

        L.marker([lat, lng]).addTo(map).bindPopup('Estás aqui').openPopup();
      });
    });

    // Carregar alertas da API
    async function carregarAlertas() {
      try {
        const res = await fetch(`${API_BASE}/api/public/alertas_ativos.php`);
        const json = await res.json();

        const data = json.data || [];
        const grid = document.getElementById('alertasGrid');
        const badge = document.getElementById('alertasBadge');

        if (data.length === 0) {
          badge.textContent = '0 ativos';
          badge.style.background = 'rgba(255,255,255,0.1)';
          badge.style.borderColor = 'rgba(255,255,255,0.2)';
          badge.style.color = 'rgba(255,255,255,0.5)';
          grid.innerHTML = '<p class="sem-alertas">Sem alertas ativos de momento.</p>';
          return;
        }

        badge.textContent = `${data.length} ativo${data.length !== 1 ? 's' : ''}`;

        grid.innerHTML = data.map(alerta => {
          const nivel = parseFloat(alerta.nivel_critico);
          const classe = nivel >= 5 ? 'critico' : 'aviso';
          const nivelLabel = classe === 'critico' ? 'Crítico' : 'Aviso';

          return `
            <div class="alerta-card ${classe}">
              <div class="alerta-top">
                <span class="alerta-rio">${alerta.nome_estacao}</span>
                <span class="alerta-nivel">${nivelLabel}</span>
              </div>
              <div class="alerta-desc">Nível atual: ${nivel} m</div>
              <div class="alerta-data">${alerta.data_hora || ''}</div>
            </div>
          `;
        }).join('');

      } catch (err) {
        document.getElementById('alertasBadge').textContent = '-';
        document.getElementById('alertasGrid').innerHTML =
          '<p class="sem-alertas">Não foi possível carregar os alertas.</p>';
      }
    }

    carregarAlertas();
  </script>

</body>
</html>
